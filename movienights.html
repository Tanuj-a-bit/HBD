<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Movie Nights 🍿🎬</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    .gallery-title {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .gallery-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .gallery-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 8px 32px var(--glass-shadow);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      overflow: hidden;
    }
    .gallery-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(212, 147, 154, 0.5);
      box-shadow: 0 12px 35px rgba(212, 147, 154, 0.2);
    }
    .gallery-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    .back-btn-container {
      margin-top: 20px;
    }
    .btn-back {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid var(--primary);
      border-radius: 30px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-back:hover {
      background: var(--primary);
      color: var(--bg-primary);
    }
    /* Full-screen Lightbox Styles */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(18, 12, 21, 0.95);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 2px solid var(--primary);
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  
  <div id="particle-container"></div>

  <div class="gallery-container">
    <h1 class="gallery-title">Cozy Movie Nights 🎬🍿</h1>
    <p class="gallery-subtitle">Oh, these iconic photos I secretly snagged from your laptop! Do you remember these cozy movie nights? ❤️</p>
    
    <!-- Audio Player Bar -->
    <div class="glass" style="padding: 15px 25px; margin: 0 auto 35px auto; max-width: 420px; display: flex; align-items: center; justify-content: space-between; border-radius: 30px;">
      <span style="font-weight: 600; color: var(--accent);">🎵 Movie Night Memories</span>
      <audio id="movie-audio" src="assets/movienights_song.m4a" loop></audio>
      <button onclick="toggleMovieAudio(this)" class="control-btn" style="padding: 8px 18px; font-size: 0.9rem;">▶ Play Audio</button>
    </div>

    <!-- Clean Grid Gallery -->
    <div class="gallery-grid">
      <div class="gallery-card" onclick="openLightbox('assets/movienights/08F5BCED-C8B8-434A-AB79-A131729FED84_1_105_c.jpeg')"><img src="assets/movienights/08F5BCED-C8B8-434A-AB79-A131729FED84_1_105_c.jpeg"></div>
      <div class="gallery-card" onclick="openLightbox('assets/movienights/26197DE6-8011-4D6C-8509-83E15770B2AC.jpeg')"><img src="assets/movienights/26197DE6-8011-4D6C-8509-83E15770B2AC.jpeg"></div>
      <div class="gallery-card" onclick="openLightbox('assets/movienights/3B0B48D2-E233-4686-A33B-FC85E541AC32_1_105_c.jpeg')"><img src="assets/movienights/3B0B48D2-E233-4686-A33B-FC85E541AC32_1_105_c.jpeg"></div>
      <div class="gallery-card" onclick="openLightbox('assets/movienights/4E40BE9F-DAF0-4BFF-BC50-AAC745EF8E0E.jpeg')"><img src="assets/movienights/4E40BE9F-DAF0-4BFF-BC50-AAC745EF8E0E.jpeg"></div>
      <div class="gallery-card" onclick="openLightbox('assets/movienights/6C6284DA-0F7D-444F-B03B-B38CDD752E6C_1_105_c.jpeg')"><img src="assets/movienights/6C6284DA-0F7D-444F-B03B-B38CDD752E6C_1_105_c.jpeg"></div>
      <div class="gallery-card" onclick="openLightbox('assets/movienights/7EB1ABAD-2AF6-41B7-9284-B9C7009D3A3B.jpeg')"><img src="assets/movienights/7EB1ABAD-2AF6-41B7-9284-B9C7009D3A3B.jpeg"></div>
      <div class="gallery-card" onclick="openLightbox('assets/movienights/C287EBB9-F0F1-4127-8446-B3BDB19B69CB.jpeg')"><img src="assets/movienights/C287EBB9-F0F1-4127-8446-B3BDB19B69CB.jpeg"></div>
      <div class="gallery-card" onclick="openLightbox('assets/movienights/DF48DB18-9853-4539-B6F1-4BF181D25BAF.jpeg')"><img src="assets/movienights/DF48DB18-9853-4539-B6F1-4BF181D25BAF.jpeg"></div>
    </div>

    <div class="back-btn-container">
      <a href="index.html#timeline" class="btn-back">← Back to Timeline</a>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged Photo">
  </div>

  <script>
    function toggleMovieAudio(btn) {
      const audio = document.getElementById("movie-audio");
      if (audio.paused) {
        audio.play();
        btn.innerText = "⏸ Pause Audio";
      } else {
        audio.pause();
        btn.innerText = "▶ Play Audio";
      }
    }

    function openLightbox(src) {
      const lb = document.getElementById("lightbox");
      const lbImg = document.getElementById("lightbox-img");
      lbImg.src = src;
      lb.classList.add("active");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    // Particle Engine
    const container = document.getElementById("particle-container");
    const heartSymbols = ["❤️", "💖", "💝", "💕", "🌸"];
    let counter = 0;
    setInterval(() => {
      counter++;
      const isPhoto = (counter % 3 === 0);
      const heart = document.createElement("div");
      if (isPhoto) {
        heart.className = "floating-heart floating-photo-particle";
        heart.innerHTML = `<img src="assets/background.jpeg" alt="Shravani" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.5);">`;
      } else {
        heart.className = "floating-heart";
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.fontSize = Math.random() * 1.5 + 0.8 + "rem";
      }
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 4 + 6 + "s";
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }, 800);
  </script>
</body>
</html>
