<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories with Neha 💖</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    .gallery-title {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .gallery-subtitle {
      color: var(--text-muted);
      margin-bottom: 40px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .gallery-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 32px var(--glass-shadow);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
    }
    .gallery-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(212, 147, 154, 0.5);
      box-shadow: 0 12px 35px rgba(212, 147, 154, 0.2);
    }
    .gallery-card img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 10px;
    }
    .back-btn-container {
      margin-top: 20px;
    }
    .btn-back {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid var(--primary);
      border-radius: 30px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-back:hover {
      background: var(--primary);
      color: var(--bg-primary);
    }
    /* Lightbox Styles */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(18, 12, 21, 0.95);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 2px solid var(--primary);
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  
  <div id="particle-container"></div>

  <div class="gallery-container">
    <h1 class="gallery-title">Memories with Neha 💖</h1>
    <p class="gallery-subtitle">A collection of beautiful moments captured in frames.</p>
    
    <div class="gallery-grid">
      <div class="gallery-card" onclick="openLightbox('assets/Neha/PHOTO-2026-08-21-12-56-37.jpg')">
        <img src="assets/Neha/PHOTO-2026-08-21-12-56-37.jpg" alt="Memory 1">
      </div>
      <div class="gallery-card" onclick="openLightbox('assets/Neha/PHOTO-2026-08-21-12-56-37 2.jpg')">
        <img src="assets/Neha/PHOTO-2026-08-21-12-56-37 2.jpg" alt="Memory 2">
      </div>
      <div class="gallery-card" onclick="openLightbox('assets/Neha/PHOTO-2026-08-21-12-56-38.jpg')">
        <img src="assets/Neha/PHOTO-2026-08-21-12-56-38.jpg" alt="Memory 3">
      </div>
      <div class="gallery-card" onclick="openLightbox('assets/Neha/PHOTO-2026-08-21-12-58-06.jpg')">
        <img src="assets/Neha/PHOTO-2026-08-21-12-58-06.jpg" alt="Memory 4">
      </div>
      <div class="gallery-card" onclick="openLightbox('assets/Neha/PHOTO-2026-08-21-13-01-22.jpg')">
        <img src="assets/Neha/PHOTO-2026-08-21-13-01-22.jpg" alt="Memory 5">
      </div>
    </div>

    <div class="back-btn-container">
      <a href="index.html#wishes" class="btn-back">← Back to Wishes</a>
    </div>
  </div>

  <!-- Lightbox Element -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged Photo">
  </div>

  <script>
    // Particle Engine
    const container = document.getElementById("particle-container");
    const heartSymbols = ["❤️", "💖", "💝", "💕", "🌸"];
    let counter = 0;
    setInterval(() => {
      counter++;
      const isPhoto = (counter % 3 === 0);
      const heart = document.createElement("div");
      if (isPhoto) {
        heart.className = "floating-heart floating-photo-particle";
        heart.innerHTML = `<img src="assets/background.jpeg" alt="Shravani" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.5);">`;
      } else {
        heart.className = "floating-heart";
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.fontSize = Math.random() * 1.5 + 0.8 + "rem";
      }
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 4 + 6 + "s";
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }, 800);

    // Lightbox functions
    function openLightbox(src) {
      const lb = document.getElementById("lightbox");
      const lbImg = document.getElementById("lightbox-img");
      lbImg.src = src;
      lb.classList.add("active");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }
  </script>
</body>
</html>
