<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Magic Gallery for Shravani ✨</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    .gallery-title {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .gallery-subtitle {
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 30px auto;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .selection-counter {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 10px 25px;
      border-radius: 30px;
      display: inline-block;
      margin-bottom: 35px;
      color: var(--primary);
      font-weight: 600;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .gallery-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 8px 32px var(--glass-shadow);
      transition: all 0.3s ease;
      position: relative;
      cursor: pointer;
    }
    .gallery-card:hover {
      transform: translateY(-5px);
      border-color: rgba(212, 147, 154, 0.5);
    }
    .gallery-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    /* Heart Favorite Checkbox Button */
    .fav-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(18, 12, 21, 0.7);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
      z-index: 5;
    }
    .gallery-card.selected {
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px rgba(212, 147, 154, 0.4);
    }
    .gallery-card.selected .fav-btn {
      background: var(--primary);
      color: white;
    }

    .back-btn-container {
      margin-top: 20px;
      margin-bottom: 40px;
    }
    .btn-back {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid var(--primary);
      border-radius: 30px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-back:hover {
      background: var(--primary);
      color: var(--bg-primary);
    }

    /* Lightbox Styles */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(18, 12, 21, 0.95);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 2px solid var(--primary);
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
    }
  </style>

  <script>
    if (sessionStorage.getItem("site_unlocked") !== "true") {
      window.location.href = "index.html";
    }
  </script>

</head>
<body>
  
  <div id="particle-container"></div>

  <div class="gallery-container">
    <h1 class="gallery-title">AI Magic Creations ✨</h1>
    <p class="gallery-subtitle">
      Haha, I don't even know how I was feeling back when I generated these! Some of them turned out so funny, but some are super cute! ❤️<br>
      <strong>Tap the heart on any photo to pick your favorite ones!</strong>
    </p>

    <div class="selection-counter" id="counter">💖 Favorites Picked: <span id="fav-count">0</span></div>
    
    <div class="gallery-grid" id="ai-grid">
      <!-- Generated photos dynamic -->
    </div>

    <div class="back-btn-container">
      <a href="index.html#timeline" class="btn-back">← Back to Timeline</a>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged Photo">
  </div>

  <script>
    const aiPhotos = [
      "10DD93CA-DAD2-4934-8955-EB6629D3C541.jpeg",
      "23ADD3CA-F366-4F00-893C-9A2FB20497A9_1_105_c.jpeg",
      "2F058243-7A68-46EA-9709-B96B3448A9E3_1_105_c.jpeg",
      "51F93622-DA24-433F-9D8C-2B8D93F288DA_1_105_c.jpeg",
      "65DCD78A-4E12-4229-99F7-C02288B43775_1_105_c.jpeg",
      "6C4CC842-8BD6-47EC-A521-9EAC7508E5C8_1_105_c.jpeg",
      "6D647A5D-80EA-4B1E-8FFC-8608A219CEF5_1_105_c.jpeg",
      "90905D24-ADC3-48A7-8F45-D1DB3EACF4DA_1_105_c.jpeg",
      "A5740821-6575-49C7-B17F-707C8F2554D3_1_105_c.jpeg",
      "A5CAD705-BCD6-42FC-BBC9-FD80F83F276F_1_105_c.jpeg",
      "A60E36E3-3737-4B64-9AB4-DA06C06DFAB5_1_105_c.jpeg",
      "AFA19DD6-F135-4097-9F5C-F393F7297AFA.jpeg",
      "B767A2F0-5EEE-44E0-ADF8-14FB93A67237_1_105_c.jpeg",
      "C9CEE3A4-2EAB-4C1A-98C5-B79D1425E583_1_105_c.jpeg",
      "CAE15AB0-6051-402A-AF68-5C895C55D098_1_105_c.jpeg",
      "D22B3A9D-0DC8-4337-99E0-82D5504FEF48_1_105_c.jpeg",
      "F070429E-243F-4BF6-B3A6-F210C073C031_1_105_c.jpeg",
      "F6F50D20-5EE8-4F91-B5A5-38855FBABEC9_1_105_c.jpeg"
    ];

    let selectedFavorites = JSON.parse(localStorage.getItem("shravani_fav_ai_photos") || "[]");

    const grid = document.getElementById("ai-grid");

    aiPhotos.forEach(filename => {
      const src = "assets/ai/" + filename;
      const isFav = selectedFavorites.includes(filename);

      const card = document.createElement("div");
      card.className = "gallery-card" + (isFav ? " selected" : "");
      
      card.innerHTML = `
        <div class="fav-btn" onclick="toggleFav(event, '${filename}', this.parentElement)">${isFav ? '❤️' : '🤍'}</div>
        <img src="${src}" onclick="openLightbox('${src}')">
      `;
      grid.appendChild(card);
    });

    updateCount();

    function toggleFav(e, filename, cardElem) {
      e.stopPropagation();
      if (selectedFavorites.includes(filename)) {
        selectedFavorites = selectedFavorites.filter(f => f !== filename);
        cardElem.classList.remove("selected");
        cardElem.querySelector(".fav-btn").innerText = "🤍";
      } else {
        selectedFavorites.push(filename);
        cardElem.classList.add("selected");
        cardElem.querySelector(".fav-btn").innerText = "❤️";
      }
      localStorage.setItem("shravani_fav_ai_photos", JSON.stringify(selectedFavorites));
      updateCount();
    }

    function updateCount() {
      document.getElementById("fav-count").innerText = selectedFavorites.length;
    }

    // Particle Engine
    const container = document.getElementById("particle-container");
    const heartSymbols = ["❤️", "💖", "💝", "💕", "🌸"];
    let counter = 0;
    setInterval(() => {
      counter++;
      const isPhoto = (counter % 3 === 0);
      const heart = document.createElement("div");
      if (isPhoto) {
        heart.className = "floating-heart floating-photo-particle";
        heart.innerHTML = `<img src="assets/background.jpeg" alt="Shravani" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.5);">`;
      } else {
        heart.className = "floating-heart";
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.fontSize = Math.random() * 1.5 + 0.8 + "rem";
      }
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 4 + 6 + "s";
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }, 800);

    function openLightbox(src) {
      const lb = document.getElementById("lightbox");
      const lbImg = document.getElementById("lightbox-img");
      lbImg.src = src;
      lb.classList.add("active");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }
  </script>
</body>
</html>
