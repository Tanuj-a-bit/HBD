<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Childhood Cutest Moments 👶❤️</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    .gallery-title {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .gallery-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .gallery-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 8px 32px var(--glass-shadow);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .gallery-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(212, 147, 154, 0.5);
    }
    .gallery-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
    }
    .back-btn-container {
      margin-top: 20px;
    }
    .btn-back {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid var(--primary);
      border-radius: 30px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-back:hover {
      background: var(--primary);
      color: var(--bg-primary);
    }
    /* Lightbox Styles */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(18, 12, 21, 0.95);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 2px solid var(--primary);
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  
  <div id="particle-container"></div>

  <div class="gallery-container">
    <h1 class="gallery-title">Little Shravani's Cute Moments 👶❤️</h1>
    <p class="gallery-subtitle">A collection of her adorable childhood memories!</p>
    
    <div class="gallery-grid">
      <div class="gallery-card" onclick="openLightbox('assets/child1/11516322-a0ee-4e0b-915a-ecded8e1980a.JPG')"><img src="assets/child1/11516322-a0ee-4e0b-915a-ecded8e1980a.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/299707ff-9dc1-4226-867f-053be0d4e9a5.JPG')"><img src="assets/child1/299707ff-9dc1-4226-867f-053be0d4e9a5.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/56bf77a3-f400-4300-8bb2-a67ff1a77189.JPG')"><img src="assets/child1/56bf77a3-f400-4300-8bb2-a67ff1a77189.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/60a19024-6c78-4927-aa3a-3abee6d92c46.JPG')"><img src="assets/child1/60a19024-6c78-4927-aa3a-3abee6d92c46.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/73bb5744-5b17-4107-883c-3a498018486b.JPG')"><img src="assets/child1/73bb5744-5b17-4107-883c-3a498018486b.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/89be63ab-ed4e-45b2-9ffd-cc77b6dc71bf.JPG')"><img src="assets/child1/89be63ab-ed4e-45b2-9ffd-cc77b6dc71bf.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/8b6dda27-15c1-45ba-9abc-6a4c8b551843.JPG')"><img src="assets/child1/8b6dda27-15c1-45ba-9abc-6a4c8b551843.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/977b00d1-86b6-4a0f-b657-91483cd117e0.JPG')"><img src="assets/child1/977b00d1-86b6-4a0f-b657-91483cd117e0.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/ab8b7167-2323-4675-989b-ddd232b4c268.JPG')"><img src="assets/child1/ab8b7167-2323-4675-989b-ddd232b4c268.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/acb5f646-d02a-404a-a651-edeaba4a68b0.JPG')"><img src="assets/child1/acb5f646-d02a-404a-a651-edeaba4a68b0.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/bafb6f2a-af8a-478b-b94e-57cdd4b0be82.JPG')"><img src="assets/child1/bafb6f2a-af8a-478b-b94e-57cdd4b0be82.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/bb622e44-9987-4a50-a25c-b81a89fbbb44.JPG')"><img src="assets/child1/bb622e44-9987-4a50-a25c-b81a89fbbb44.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/ce064df0-d7be-41e7-8d56-adc0c499621d.JPG')"><img src="assets/child1/ce064df0-d7be-41e7-8d56-adc0c499621d.JPG"></div>
      <div class="gallery-card" onclick="openLightbox('assets/child1/ef3103d9-9a29-4306-b2c9-deb4815b89ba.JPG')"><img src="assets/child1/ef3103d9-9a29-4306-b2c9-deb4815b89ba.JPG"></div>
    </div>

    <div class="back-btn-container">
      <a href="index.html#timeline" class="btn-back">← Back to Timeline</a>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged Photo">
  </div>

  <script>
    // Particle Engine
    const container = document.getElementById("particle-container");
    const heartSymbols = ["❤️", "💖", "💝", "💕", "🌸"];
    let counter = 0;
    setInterval(() => {
      counter++;
      const isPhoto = (counter % 3 === 0);
      const heart = document.createElement("div");
      if (isPhoto) {
        heart.className = "floating-heart floating-photo-particle";
        heart.innerHTML = `<img src="assets/background.jpeg" alt="Shravani" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.5);">`;
      } else {
        heart.className = "floating-heart";
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.fontSize = Math.random() * 1.5 + 0.8 + "rem";
      }
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 4 + 6 + "s";
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }, 800);

    function openLightbox(src) {
      const lb = document.getElementById("lightbox");
      const lbImg = document.getElementById("lightbox-img");
      lbImg.src = src;
      lb.classList.add("active");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }
  </script>
</body>
</html>
